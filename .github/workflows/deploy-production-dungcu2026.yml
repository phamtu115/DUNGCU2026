name: Deploy production dungcu2026

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - 'index.html'
      - 'styles.css'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/deploy-production-dungcu2026.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify application
        run: npm run check
      - name: Verify Vercel credential
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Thiếu GitHub Actions secret VERCEL_TOKEN. Hãy tạo token Vercel có quyền team phamtu1990s-projects và lưu vào repository secret VERCEL_TOKEN."
            exit 1
          fi
      - name: Link exact Vercel project
        run: npx --yes vercel@latest link --yes --project dungcu2026 --scope phamtu1990s-projects --token "$VERCEL_TOKEN"
      - name: Pull production environment
        run: npx --yes vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
      - name: Build production
        run: npx --yes vercel@latest build --prod --token "$VERCEL_TOKEN"
      - name: Deploy production
        id: deploy
        run: |
          DEPLOY_URL=$(npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Production URL: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
